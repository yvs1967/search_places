<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A-Z Places Directory</title>
  <style>
    :root {
      --primary: #2563eb;
      --border: #e2e8f0;
      --bg-letter: #f8fafc;
      --text: #1e293b;
      --muted: #64748b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 16px;
      color: var(--text);
      background-color: #fafafa;
    }
    .header-container { margin-bottom: 24px; }
    h1 { margin: 0 0 8px 0; font-size: 2rem; }
    .status { color: var(--muted); font-size: 0.95rem; }

    .search-box {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 16px;
      background: #ffffff;
      outline: none;
      transition: all 0.2s;
    }
    .search-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .alphabet-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      position: sticky;
      top: 0;
      background: #fafafa;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }
    .alphabet-nav a {
      display: inline-block;
      min-width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      transition: background 0.15s, color 0.15s;
    }
    .alphabet-nav a:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .letter-group {
      margin-top: 32px;
      scroll-margin-top: 64px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
    }
    .letter-header {
      font-size: 1.4rem;
      font-weight: 700;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      color: var(--primary);
    }
    .places-list {
      list-style: none;
      padding: 0;
      margin: 8px 0 0 0;
    }
    .place-row {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .place-row:last-child { border-bottom: none; }
    .place-name { font-weight: 600; font-size: 1rem; }
    .place-tags { display: flex; gap: 8px; }
    .tag {
      font-size: 0.75rem;
      background: var(--bg-letter);
      color: var(--muted);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>Places Directory</h1>
    <div id="status" class="status">Loading directory...</div>
  </div>

  <input type="text" id="searchInput" class="search-box" placeholder="Filter by place name, country, or category..." />
  <nav class="alphabet-nav" id="alphabetNav"></nav>
  <div id="placesContainer"></div>

  <script>
    let allPlaces = [];
    const statusEl = document.getElementById("status");
    const navEl = document.getElementById("alphabetNav");
    const containerEl = document.getElementById("placesContainer");
    const searchInput = document.getElementById("searchInput");

    // Fetch static JSON generated by GitHub Actions
    async function loadDirectory() {
      try {
        const response = await fetch("places.json");
        if (!response.ok) throw new Error("Could not find places.json");
        allPlaces = await response.json();

        statusEl.textContent = `Showing ${allPlaces.length} locations sorted alphabetically.`;
        renderDirectory(allPlaces);
      } catch (err) {
        statusEl.textContent = "Unable to load data. If you just set this up, allow the GitHub Action 1-2 minutes to finish.";
        console.error(err);
      }
    }

    function renderDirectory(data) {
      containerEl.innerHTML = "";
      navEl.innerHTML = "";

      if (data.length === 0) {
        containerEl.innerHTML = `<div class="empty-state">No matching places found.</div>`;
        return;
      }

      // Group places by starting character
      const groups = {};
      data.forEach(item => {
        const firstChar = String(item.name || "").trim().charAt(0).toUpperCase();
        const letter = /^[A-Z]$/.test(firstChar) ? firstChar : "#";
        if (!groups[letter]) groups[letter] = [];
        groups[letter].push(item);
      });

      const sortedLetters = Object.keys(groups).sort((a, b) => {
        if (a === "#") return 1;
        if (b === "#") return -1;
        return a.localeCompare(b);
      });

      // Build Navigation & Place Groups
      sortedLetters.forEach(letter => {
        const link = document.createElement("a");
        link.href = `#group-${letter}`;
        link.textContent = letter;
        navEl.appendChild(link);

        const section = document.createElement("section");
        section.className = "letter-group";
        section.id = `group-${letter}`;

        const header = document.createElement("div");
        header.className = "letter-header";
        header.textContent = letter;
        section.appendChild(header);

        const list = document.createElement("ul");
        list.className = "places-list";

        groups[letter].forEach(place => {
          const row = document.createElement("li");
          row.className = "place-row";
          row.innerHTML = `
            <span class="place-name">${place.name}</span>
            <div class="place-tags">
              ${place.country ? `<span class="tag">${place.country}</span>` : ""}
              ${place.category ? `<span class="tag">${place.category}</span>` : ""}
            </div>
          `;
          list.appendChild(row);
        });

        section.appendChild(list);
        containerEl.appendChild(section);
      });
    }

    // Live search filter
    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        renderDirectory(allPlaces);
        return;
      }

      const filtered = allPlaces.filter(p => 
        (p.name && String(p.name).toLowerCase().includes(q)) ||
        (p.country && String(p.country).toLowerCase().includes(q)) ||
        (p.category && String(p.category).toLowerCase().includes(q))
      );
      renderDirectory(filtered);
    });

    loadDirectory();
  </script>
</body>
</html>
