name: Sync Places from Google Sheets

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Data from Apps Script
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          # Fetch JSON and follow redirects (-L)
          curl -s -L "$APPS_SCRIPT_URL" -o temp_places.json

          # Verify that output is valid JSON and not an authorization error
          if grep -q "Unauthorized access" temp_places.json; then
            echo "::error::Apps Script returned an Unauthorized error. Check your API key and secret."
            cat temp_places.json
            exit 1
          fi

          mv temp_places.json places.json

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add places.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync places.json from Google Sheets" && git push)
